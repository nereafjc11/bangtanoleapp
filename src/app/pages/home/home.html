
<div class="home-container">

  <header class="home-header">
    <h1>Bangtanole 💜</h1>
    <button (click)="cerrarSesion()">Cerrar sesión</button>
  </header>

  <main class="welcome-card">

    <h2>¡Bienvenida a Bangtanole! 💜</h2>

    <p>Tu pequeño rincón del universo ARMY.</p>

    <p *ngIf="email" class="user-email">
      Has iniciado sesión como: {{ email }}
    </p>

    <div class="coming-soon">
      <h3>¡Esto acaba de empezar!</h3>
      <p>
        Estamos preparando un espacio especial para todas las ARMY.
        Muy pronto encontrarás muchas cosas por descubrir.
      </p>
      <span>💜 BTS FOREVER 💜</span>
    </div>

  </main>

</div>
