
<div class="register-container">

  <div class="background-shape shape-top"></div>
  <div class="background-shape shape-bottom"></div>

  <main class="register-layout">

    <!-- LOGO -->
    <section class="brand-section">
      <img
        src="/img/logo-bangtanole.png"
        alt="Logo Bangtan Olé"
        class="brand-logo"
      />
    </section>

    <!-- FORMULARIO -->
    <section class="form-section">

      <div class="register-card">

        <div class="form-header">
          <h2>Crear cuenta</h2>
        </div>

        <form (ngSubmit)="registrarse()">

          <label for="nombre">Nombre de usuario</label>

          <div class="input-group">
            <input
              id="nombre"
              type="text"
              name="nombre"
              [(ngModel)]="nombre"
              placeholder="Tu nombre"
              autocomplete="username"
              required
            />
          </div>

          <label for="email">Correo electrónico</label>

          <div class="input-group">
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Tu correo electrónico"
              autocomplete="email"
              required
            />
          </div>

          <label for="password">Contraseña</label>

          <div class="input-group">
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Crea una contraseña"
              autocomplete="new-password"
              required
            />
          </div>

          <label for="confirmPassword">Confirmar contraseña</label>

          <div class="input-group">
            <input
              id="confirmPassword"
              type="password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              required
            />
          </div>

          <p class="mensaje" *ngIf="mensaje">
            {{ mensaje }}
          </p>

          <button type="submit" [disabled]="cargando">
            {{ cargando ? 'Creando cuenta...' : 'Crear cuenta 💜' }}
          </button>

        </form>

        <div class="login-link">
          <p>¿Ya tienes cuenta?</p>
          <a routerLink="/auth/login">Iniciar sesión</a>
        </div>

      </div>

    </section>

  </main>

</div>
